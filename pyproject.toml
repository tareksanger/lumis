[project]
name = "lumis-ai"
version = "0.1.1a6"
description = "An AI agent framework for building LLM-powered applications"
readme = "README.md"
license = "MIT"
authors = [
    { name = "tareksanger", email = "23141675+tareksanger@users.noreply.github.com" },
]
requires-python = ">=3.11"
keywords = ["ai", "agents", "llm", "nlp", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "asgiref>=3.8.1",
    "beautifulsoup4>=4.12.0",
    "deepmerge>=2.0.0",
    "faiss-cpu>=1.7.0",
    "googlesearch-python>=1.2.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.24.0",
    "langchain>=0.3.4",
    "langchain-core>=0.3.13",
    "lxml>=4.9.0",
    "minify-html>=0.11.0",
    "nltk>=3.9.0",
    "numpy>=1.24",
    "ollama>=0.3.0",
    "openai>=1.52.2",
    "pandas>=2.0.0",
    "PyMuPDF>=1.22.0",
    "PyPDF2>=3.0.0",
    "pydantic>=2.9.2",
    "python-dateutil>=2.8.0",
    "pyvis>=0.3.0",
    "readability-lxml>=0.8.0",
    "redis>=5.0.0",
    "requests>=2.28.0",
    "scikit-learn>=1.0.0",
    "sentence-transformers>=2.2.2",
    "tenacity>=9.0.0",
    "textstat>=0.7.0",
    "tiktoken>=0.5.0",
    "torch>=2.5.0",
    "transformers>=4.0.0",
    "typing-extensions>=4.0.0",
    "wikipedia>=1.4.0",
    "google-genai>=1.61.0",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
]
search = [
    "arxiv>=0.5.0",
    "pytrends>=4.5.0",
    "tavily-python>=0.3.0",
    "yfinance>=0.2.0",
]
spacy = [
    "pytextrank>=3.2.0",
    "spacy>=3.7.0,<3.8.0",
    "spacy-llm>=0.7.2",
]

[project.urls]
Homepage = "https://github.com/tareksanger/lumis"
Repository = "https://github.com/tareksanger/lumis"
Issues = "https://github.com/tareksanger/lumis/issues"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython-ngql>=0.14.3",
    "jupyter>=1.1.1",
    "kagglehub>=0.3.3",
    "mccabe>=0.7.0",
    "pydantic-settings>=2.6.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
torch = [
    { index = "pytorch", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumis"]
exclude = ["tests/", "cookbook/"]

[tool.pylint."messages control"]
disable = "all"
enable = [
  "empty-docstring",
  "missing-function-docstring",
]
ignore = ["setup.py", "__init__.py"]
ignore-paths = ["tests", "migrations"]

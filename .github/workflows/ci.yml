name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check dependency compatibility
        run: uv pip check
      - name: Check LLM typing contracts
        # Static contracts complement runtime mocks, which cannot detect lost types.
        run: uv run --no-sync pyright --warnings
      - name: Run unit tests and coverage
        run: uv run --no-sync pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=html
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
